<div class="chat-container">
  <div class="chat-header">
      <i class="pi pi-database"></i>
      <span>Database Course Assistant</span>
  </div>

  <div class="messages-area">
      <div *ngIf="messages.length === 0" class="empty-state">
          <i class="pi pi-comments"></i>
          <p>Ask a question about your database course material</p>
      </div>

      <div *ngFor="let msg of messages; let i = index" 
           class="message-wrapper"
           [class.user-wrapper]="msg.role === 'user'"
           [class.assistant-wrapper]="msg.role === 'assistant'">
          
          <div class="message-bubble"
               [class.user-bubble]="msg.role === 'user'"
               [class.assistant-bubble]="msg.role === 'assistant'">
              
              <div class="message-role">
                  <i [class]="msg.role === 'user' ? 'pi pi-user' : 'pi pi-server'"></i>
                  {{ msg.role === 'user' ? 'You' : 'Assistant' }}
              </div>

              <div class="message-content" [innerHTML]="renderMarkdown(msg.content)"></div>
              <button 
                  *ngIf="msg.role === 'assistant'"
                  class="copy-btn"
                  (click)="copyMessage(msg.content, i)"
                  title="Copy answer">
                  <i [class]="copiedMessages.has(i) ? 'pi pi-check' : 'pi pi-copy'"></i>
              </button>
              <div *ngIf="msg.sources && msg.sources.length > 0" class="sources">
                  <span class="sources-label">Sources</span>
                  <p-tag 
                      *ngFor="let source of msg.sources"
                      [value]="source"
                      severity="secondary">
                  </p-tag>
              </div>
          </div>
      </div>

      <div *ngIf="loading" class="loading-wrapper">
          <p-progressSpinner 
              strokeWidth="3"
              [style]="{ width: '2rem', height: '2rem' }">
          </p-progressSpinner>
          <span>{{ currentLoadingMessage }}</span>
      </div>

      <div #scrollAnchor></div>
  </div>

  <div class="input-area">
      <input 
          pInputText
          [(ngModel)]="question"
          (keydown)="onEnter($event)"
          placeholder="Ask a question..."
          [disabled]="loading"
          class="question-input" />
      <p-button 
          icon="pi pi-send"
          [disabled]="loading || !question.trim()"
          (onClick)="ask()">
      </p-button>
  </div>
</div>
